plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
   //  id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id 'com.google.gms.google-services'
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = '17'
        }
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            project.android.namespace = "com.pusher.client"
        }
    }
}
android {
    namespace = "com.example.sirius"

    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
//    compileOptions {
//        sourceCompatibility = JavaVersion.VERSION_17
//        targetCompatibility = JavaVersion.VERSION_17
//    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true

    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    compileSdkVersion 35
    buildToolsVersion "30.0.3"
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.sirius"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true

    }

//    buildTypes {
//        release {
//            minifyEnabled false
//
////            release {
////                minifyEnabled true
////                proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
////            }
//
//            // TODO: Add your own signing config for the release build.
//            signingConfig = signingConfigs.debug
//        }
//        debug {
//
//            minifyEnabled false
//
//    }   }

    buildTypes {

        release {

            minifyEnabled true       // لتشغيل R8/ProGuard
            shrinkResources true     // لحذف الموارد غير المستخدمة
//            minifyEnabled true // تفعيل تقليص الكود
//            shrinkResources true // تفعيل إزالة الموارد غير المستخدمة
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }

    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.5'
}
flutter {
    source = "../.."
}
dependencies {

    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
